name: release-runtime

on:
  push:
    tags: ["v*"]
  # release-please 用 GITHUB_TOKEN 建 tag，而 GITHUB_TOKEN 觸發的事件**不會**啟動
  # 新的 workflow run（GitHub 用這條規則擋遞迴）。所以合併 release PR 之後這支要
  # 手動派送，不能只靠上面的 tag 觸發——沒有這個入口，chain 會安靜地斷在這裡。
  workflow_dispatch:
    inputs:
      tag:
        description: 要建置並發佈的 tag（例如 v0.2.0）
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Windows runner 的預設 shell 是 PowerShell，它不吃反斜線續行、glob 與引號規則
# 也不一樣。同一份 run 腳本要在三種 OS 上有同一個意思，就得把 shell 釘死。
defaults:
  run:
    shell: bash

jobs:
  build:
    name: runtime (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: win32-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CPython 3.12
        run: uv python install 3.12

      # --only-binary=:all: 讓任何沒有 wheel 的套件當場紅燈。靜默掉進 sdist 編譯
      # 會產出「裝得起來、跑起來才炸」的 runtime，那比建置失敗難查一百倍。
      - name: Install runtime site-packages
        # Windows runner 的預設 shell 是 PowerShell，它不吃 `\` 續行
        # （症狀是 ParserError: Missing expression after unary operator '--'）。
        run: |
          uv pip install --only-binary=:all: --target site-packages \
            --python-version 3.12 \
            -r packaging/runtime/requirements-${{ matrix.target }}.txt

      # D2 硬門檻：onnxruntime 是 native extension，wheel 裝得進去卻 import 失敗
      # 是這條鏈最常見的失敗形態，只有真的推論一次才看得出來。任一平台失敗即中止發版。
      - name: OCR smoke test
        env:
          PYTHONPATH: site-packages
          PYTHONNOUSERSITE: "1"
        run: |
          "$(uv python find 3.12)" -s packaging/runtime/smoke_ocr.py \
            --image tests/fixtures/captcha_sample.png

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web
        # 刻意不設定任何 NEXT_PUBLIC_*：loopback base 必須以字面值內聯進 client chunk，
        # build_runtime.py 會在打包前斷言它存在。
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Assemble runtime artifact
        run: |
          "$(uv python find 3.12)" packaging/runtime/build_runtime.py \
            --target ${{ matrix.target }} \
            --site-packages site-packages \
            --out dist-runtime

      # 兩個平台的 job 同時對同一個 release 上傳，`--clobber` 是「先刪再傳」，
      # 撞在一起時 uploads API 會回 404——即使檔案其實已經落地。改成冪等：
      # 已經在上面的就不碰。這順便把「已發佈的 asset 不得重傳」機械化，也讓
      # tar.gz 與它的 .sha256 永遠是同一次建置產生的那一對。
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          present() { gh release view "$TAG" --json assets -q '.assets[].name'; }
          for path in dist-runtime/*; do
            name=$(basename "$path")
            if present | grep -qx "$name"; then
              echo "已存在，略過：$name"
              continue
            fi
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$path"; then
                uploaded=true
                break
              fi
              echo "上傳 $name 第 $attempt 次未成功，確認是否其實已落地…"
              sleep 10
              if present | grep -qx "$name"; then
                uploaded=true
                break
              fi
            done
            if [ "$uploaded" != true ]; then
              echo "::error::$name 上傳失敗" >&2
              exit 1
            fi
          done

  publish:
    name: manifest + npm publish
    needs: build
    # 不能用 ubuntu：packages/cli 宣告 os 只有 darwin/win32，npm 會以 EBADPLATFORM
    # 拒絕在 Linux 上安裝它，連 devDependencies 都裝不了（發版前的 CLI 測試因此跑不了）。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build runtime manifest from release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/build_manifest.mjs --tag "$TAG"

      - name: Cross-check manifest against assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/build_manifest.mjs --verify --tag "$TAG"

      - name: Redact public release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body -q .body > raw-notes.md
          node scripts/release/redact_notes.mjs --in raw-notes.md --out public-notes.md
          gh release edit "$TAG" --notes-file public-notes.md

      - name: Install CLI deps
        working-directory: packages/cli
        run: npm ci

      - name: CLI tests
        working-directory: packages/cli
        run: npm test

      # `npm --prefix` 對 publish 無效——publish 看的是 cwd，所以那樣寫會去打包
      # repo root（實測產出 426 個檔案、名稱 auto-ticket，靠 root 的 private: true
      # 才被 EPRIVATE 擋下）。用 working-directory，再加一道明確斷言。
      - name: Assert we are publishing the CLI package
        working-directory: packages/cli
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "將發佈：$name@$version"
          test "$name" = "@yuzen9622/auto-ticket"
          test "v$version" = "$TAG"

      - name: npm publish
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Promote release out of draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
