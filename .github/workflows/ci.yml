name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (invariants / pytest / web / cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 不變式守門員的 G1 會對凍結路徑跑 `git diff HEAD`，需要完整的工作樹狀態。
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Install web deps
        run: pnpm --dir web install --frozen-lockfile

      - name: Install CLI deps
        run: npm --prefix packages/cli ci

      - name: Invariant guards
        run: uv run python scripts/check_invariants.py

      - name: pytest
        run: uv run pytest

      - name: Public-release audit
        run: uv run python scripts/audit_public_release.py

      - name: typecheck
        run: pnpm --dir web run typecheck

      - name: lint
        run: pnpm --dir web run lint

      - name: web tests
        run: pnpm --dir web run test

      - name: contract
        run: pnpm --dir web run check:contract

      - name: CLI tests
        run: npm --prefix packages/cli test

  launcher-integration:
    name: launcher e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CLI deps
        run: npm --prefix packages/cli ci

      # CLI 測試含假 runtime 的端到端（真 http server、真系統 tar、真檔案系統）。
      # 系統 tar 的行為三個平台不一樣，那是只有實跑才守得住的東西。
      - name: CLI tests
        run: npm --prefix packages/cli test
