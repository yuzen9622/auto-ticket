name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (invariants / pytest / web / cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 不變式守門員的 G1 會對凍結路徑跑 `git diff HEAD`，需要完整的工作樹狀態。
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 前端測試鏈要新版 Node：jsdom@30 要 ^22.22.2 || ^24.15.0 || >=26，
          # undici@8 要 >=22.19。Node 20 會在載入 jsdom 時就炸
          # （webidl.util.markAsUncloneable is not a function），一個測試都跑不到。
          node-version: 24

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Install web deps
        run: pnpm --dir web install --frozen-lockfile

      - name: Invariant guards
        run: uv run python scripts/check_invariants.py

      - name: pytest
        run: uv run pytest

      - name: Public-release audit
        run: uv run python scripts/audit_public_release.py

      - name: typecheck
        run: pnpm --dir web run typecheck

      - name: lint
        run: pnpm --dir web run lint

      - name: web tests
        run: pnpm --dir web run test

      - name: contract
        run: pnpm --dir web run check:contract

  # CLI 不在 ubuntu 上測：`packages/cli/package.json` 宣告 os 只有 darwin/win32，
  # npm 會以 EBADPLATFORM 拒絕在 Linux 上安裝它——連 devDependencies 都裝不了。
  # 那個宣告是給使用者的正確保護，所以改成在它真正支援的三個平台上測。
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # CLI 刻意釘在它宣告支援的最低版本（engines.node >= 20.10）——
          # 要證明的就是那個下界成立，不要跟上面的前端 job 一起升。
          node-version: 20

      - name: Install CLI deps
        run: npm --prefix packages/cli ci

      # CLI 測試含假 runtime 的端到端（真 http server、真系統 tar、真檔案系統）。
      # 系統 tar 的行為三個平台不一樣，那是只有實跑才守得住的東西。
      - name: CLI tests
        run: npm --prefix packages/cli test
