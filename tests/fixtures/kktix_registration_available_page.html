<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><title>KKTIX 購票登記頁</title></head>
<body>
<!-- 2026-09-22 由真瀏覽器抓 https://kktix.com/events/.../registrations/new 的票種區塊原樣剪下。
     兩個票種都還選得到：各自有 ng-model='ticketModel.quantity' 的張數輸入框。 -->
<div id="registrationsNewApp"><div class="ticket-list">
<div class="ticket-unit ng-scope" ng-class="{active: ticketModel.quantity != 0}" ng-controller="TicketCtrl" ng-init="index = $index" ng-repeat="ticket in tickets | orderBy:'position'">
<div class="display-table" id="ticket_1058832">
<div class="display-table-row">
<span class="ticket-name ng-binding">
              一般票/前區
              <!-- ngIf: unitNotice -->
<!-- ngIf: !!ticket.labelsText --><div class="small text-muted ng-binding ng-scope" ng-if="!!ticket.labelsText">前區</div><!-- end ngIf: !!ticket.labelsText -->
<div class="ticket-extra-info">
<!-- ngIf: ticket.for_online_event -->
</div>
</span>
<!-- ngIf: showSeatInfo() --><span class="ticket-seat ng-binding ng-scope" ng-if="showSeatInfo()">自行選位</span><!-- end ngIf: showSeatInfo() -->
<span class="ticket-price">
<!-- ngIf: ticket.price --><span class="ng-scope" ng-if="ticket.price">
<!-- ngIf: ticket.price.cents > 0 --><span class="ng-binding ng-scope" ng-if="ticket.price.cents &gt; 0">
                TWD$1,000
                <span class="mobile-fee ng-binding" ng-bind-html="ticket.booking_fee_cents | feeAnnotation : ticket.price.currency"></span>
</span><!-- end ngIf: ticket.price.cents > 0 -->
<!-- ngIf: ticket.price.cents ==  0 -->
</span><!-- end ngIf: ticket.price -->
</span>
<!-- ngIf: chargeBookingFee -->
<!-- ngIf: purchasableAndSelectable --><span class="ticket-quantity ng-scope" ng-if="purchasableAndSelectable">
<button class="btn-default minus" disabled="disabled" ng-click="quantityBtnClick(-1)" ng-disabled="ticketModel.quantity &lt;= 0 || busy">
<i class="fa fa-minus"></i>
</button>
<input class="ng-pristine ng-untouched ng-valid ng-not-empty" ng-disabled="busy" ng-keydown="quantityInputKeyDown($event)" ng-keyup="quantityInputKeyUp($event)" ng-model="ticketModel.quantity" type="text" value="0"/>
<button class="btn-default plus" ng-click="quantityBtnClick(1)" ng-disabled="cantBuyMore()">
<i class="fa fa-plus"></i>
</button>
</span><!-- end ngIf: purchasableAndSelectable -->
<!-- ngIf: !purchasableAndSelectable -->
</div>
<!-- ngRepeat: addOn in ticket.add_ons -->
</div>
<!-- <div class="message" ng-if="showKKTIXonly" ng-bind-html="showKKTIXonlyMsg"></div> -->
<!-- ngIf: hasOrderStageQualifications && ticketModel.quantity > 0 -->
<!-- ngRepeat: code in ticketModel.invitationCodes track by $index -->
</div>
<div class="ticket-unit ng-scope" ng-class="{active: ticketModel.quantity != 0}" ng-controller="TicketCtrl" ng-init="index = $index" ng-repeat="ticket in tickets | orderBy:'position'">
<div class="display-table" id="ticket_1058833">
<div class="display-table-row">
<span class="ticket-name ng-binding">
              一般票/後區
              <!-- ngIf: unitNotice -->
<!-- ngIf: !!ticket.labelsText --><div class="small text-muted ng-binding ng-scope" ng-if="!!ticket.labelsText">後區</div><!-- end ngIf: !!ticket.labelsText -->
<div class="ticket-extra-info">
<!-- ngIf: ticket.for_online_event -->
</div>
</span>
<!-- ngIf: showSeatInfo() --><span class="ticket-seat ng-binding ng-scope" ng-if="showSeatInfo()">自行選位</span><!-- end ngIf: showSeatInfo() -->
<span class="ticket-price">
<!-- ngIf: ticket.price --><span class="ng-scope" ng-if="ticket.price">
<!-- ngIf: ticket.price.cents > 0 --><span class="ng-binding ng-scope" ng-if="ticket.price.cents &gt; 0">
                TWD$600
                <span class="mobile-fee ng-binding" ng-bind-html="ticket.booking_fee_cents | feeAnnotation : ticket.price.currency"></span>
</span><!-- end ngIf: ticket.price.cents > 0 -->
<!-- ngIf: ticket.price.cents ==  0 -->
</span><!-- end ngIf: ticket.price -->
</span>
<!-- ngIf: chargeBookingFee -->
<!-- ngIf: purchasableAndSelectable --><span class="ticket-quantity ng-scope" ng-if="purchasableAndSelectable">
<button class="btn-default minus" disabled="disabled" ng-click="quantityBtnClick(-1)" ng-disabled="ticketModel.quantity &lt;= 0 || busy">
<i class="fa fa-minus"></i>
</button>
<input class="ng-pristine ng-untouched ng-valid ng-not-empty" ng-disabled="busy" ng-keydown="quantityInputKeyDown($event)" ng-keyup="quantityInputKeyUp($event)" ng-model="ticketModel.quantity" type="text" value="0"/>
<button class="btn-default plus" ng-click="quantityBtnClick(1)" ng-disabled="cantBuyMore()">
<i class="fa fa-plus"></i>
</button>
</span><!-- end ngIf: purchasableAndSelectable -->
<!-- ngIf: !purchasableAndSelectable -->
</div>
<!-- ngRepeat: addOn in ticket.add_ons -->
</div>
<!-- <div class="message" ng-if="showKKTIXonly" ng-bind-html="showKKTIXonlyMsg"></div> -->
<!-- ngIf: hasOrderStageQualifications && ticketModel.quantity > 0 -->
<!-- ngRepeat: code in ticketModel.invitationCodes track by $index -->
</div>
</div></div>
</body>
</html>
