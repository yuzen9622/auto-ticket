[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-ticket"
version = "0.1.0" # x-release-please-version
description = "Automated ticketing research platform (KKTIX)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "sqlalchemy[asyncio]>=2.0.44",
    "aiosqlite>=0.21",
    "rapidfuzz>=3.14",
    "httpx>=0.28",
    "beautifulsoup4>=4.14",
    # 核心引擎依賴（僅追加；不得回頭放寬上列任一約束、不得移除 [asyncio] extra）
    "apscheduler>=3.10.4",
    "ntplib>=0.4.0",
    "playwright>=1.60",
    "python-statemachine>=3.2.0",
    "structlog>=24.1.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
    "cryptography>=50.0.1",
    "ddddocr>=1.6.1",
    # ddddocr 沒有釘住 onnxruntime，而 1.24 之後就不再出 macOS x86_64 wheel，
    # 1.30 更只剩 arm64。在 Intel Mac 上讓解析器自由挑選＝必定挑到沒有 wheel 的
    # 版本，再掉進 sdist 編譯。見下方 [tool.uv]：這條上界必須被擋在 dev 鎖定範圍外。
    "onnxruntime>=1.23.2,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv]
# uv.lock 是通用鎖定檔，會把所有平台壓成同一個版本。把 Intel Mac 排除在鎖定範圍外，
# 上面那條 ORT 上界才不會反過來把 arm64 dev 機（CPython 3.14）拖到裝不起來的版本。
# Intel Mac 的實際鎖定在 packaging/runtime/requirements-darwin-x64.txt，與此檔無關。
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = [
    "src/domain",
    "src/storage",
    "src/adapters",
    "src/telemetry",
    "src/fsm",
    "src/scheduler",
    "src/browser",
    "src/strategy",
    "src/purchase",
    "src/api",
    "src/accounts",
    "src/broker",
    "src/worker",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# 實站套件預設不收集；帶 --live 時由根目錄 conftest.py 解除此 ignore。
addopts = "-q --ignore=tests/live"
markers = [
    "live: 需要真實網路與瀏覽器的實站唯讀驗證（預設不收集，需 --live）",
]

[tool.pyright]
extraPaths = ["src"]
