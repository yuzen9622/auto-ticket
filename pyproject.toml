[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-ticket"
version = "0.1.0"
description = "Automated ticketing research platform (KKTIX)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "sqlalchemy[asyncio]>=2.0.44",
    "aiosqlite>=0.21",
    "rapidfuzz>=3.14",
    "httpx>=0.28",
    "beautifulsoup4>=4.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/domain", "src/storage", "src/adapters"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
