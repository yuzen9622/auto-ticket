[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-ticket"
version = "0.1.0"
description = "Automated ticketing research platform (KKTIX)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "sqlalchemy[asyncio]>=2.0.44",
    "aiosqlite>=0.21",
    "rapidfuzz>=3.14",
    "httpx>=0.28",
    "beautifulsoup4>=4.14",
    # 核心引擎依賴（僅追加；不得回頭放寬上列任一約束、不得移除 [asyncio] extra）
    "apscheduler>=3.10.4",
    "ntplib>=0.4.0",
    "playwright>=1.40.0",
    "python-statemachine>=3.2.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = [
    "src/domain",
    "src/storage",
    "src/adapters",
    "src/telemetry",
    "src/fsm",
    "src/scheduler",
    "src/browser",
    "src/strategy",
    "src/purchase",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# 實站套件預設不收集；帶 --live 時由根目錄 conftest.py 解除此 ignore。
addopts = "-q --ignore=tests/live"
markers = [
    "live: 需要真實網路與瀏覽器的實站唯讀驗證（預設不收集，需 --live）",
]
